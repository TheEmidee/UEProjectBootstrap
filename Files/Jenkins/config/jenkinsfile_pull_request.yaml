pipeline_name: "pull_request"
customization_folder: "Customization"
project:
  name: "@projectName@"
jenkins:
  default_node_names: ""
  workspace_suffix: ""
features:
  properties:
    items:
      - "disableConcurrentBuilds( abortPrevious: true )"
      - "githubProjectProperty(displayName: '', projectUrlStr: 'https://github.com/REPLACE_BY_GITHUB_COMPOANY/REPLACE_BY_GITHUB_REPOSITORY/')"
  github:
    owner: "REPLACE_BY_GITHUB_COMPOANY"
    repository: "REPLACE_BY_GITHUB_REPOSITORY"
    credentials_id: "Access_Token"
    pull_requests:
      filter:
        tokens:
          - "WIP"
          - "NO_CI"
        message: "This pull request is ignored because the token ${foundToken} was found in the title."
      update_description_from_pr_body: true
  slack_notifications:
    channel: "#REPLACE_BY_SLACK_CHANNEL"
    message_template: " : ${env.JOB_NAME} - ${env.CHANGE_BRANCH} #${env.BUILD_NUMBER} (<${env.BUILD_URL}|Open>)"
  git:
    use_simple_checkout: true
  python:
    venv_activation_script_path: "./Setup.ps1"
    venv_folder: "Scripts/Python/.venv"
  unreal:
    project:
      uproject_path: "../../../../@projectName@.uproject"
    buildgraph:
      target: "BuildAndTest @projectName@"
      properties:
        TargetConfigurations: "Development"
        Skip_Test_EditorBoot: "True"
        Skip_Test_TargetBoot: "True"
        Test_FunctionalTests_InEditor: "False"
        With_Test_FunctionalTests: "False"
        Targets: "REPLACE_BY_BUILDGRAPH_TARGETS"
    cleanup_after_build:
      enabled: true
      additional_node_name: "Win64"
